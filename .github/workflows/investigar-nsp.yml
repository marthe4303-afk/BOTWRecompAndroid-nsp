name: Investigar importador NSP
on:
  workflow_dispatch:

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar o repositório do importador
        run: |
          git remote add amaral https://github.com/rickamaral94/Botwnspxci.git
          git fetch amaral ccr-83419136-h3hlw3 --no-tags

      
      - name: Comparar os projetos
        run: |
          R=amaral/ccr-83419136-h3hlw3
          BASE=$(git merge-base HEAD "$R")

          {
            echo "## Distância entre os projetos"
            git rev-list --left-right --count HEAD..."$R"

            echo
            echo "## Commits exclusivos do importador"
            git log --oneline "$BASE..$R" | head -100

            echo
            echo "## Alterações do importador"
            git diff --stat "$BASE" "$R"

            echo
            echo "## Arquivos modificados pelo importador"
            git diff --name-status "$BASE" "$R" | head -150

            echo
            echo "## Alterações exclusivas do meu fork"
            git diff --stat "$BASE" HEAD
          } > relatorio_comparacao.md

          cat relatorio_comparacao.md
          cat relatorio_comparacao.md >> "$GITHUB_STEP_SUMMARY"
